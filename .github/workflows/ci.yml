name: CI Pipeline - FastAPI Docker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar código del repositorio local
        uses: actions/checkout@v4

      - name: Construir imagen de Docker
        run: docker build -t fastapi-users-api:latest .
