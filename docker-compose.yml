services:
  db:
    image: postgres:15-alpine
    container_name: postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: adrian
      POSTGRES_PASSWORD: adrian123
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data

volumes:
  postgres_data_local:
