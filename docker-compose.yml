
services:
  api:
    build: .
    container_name: fastapi_chat_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres_user:TuSuperPassword@db:5432/chat_db
    depends_on:
      - db
    networks:
      - devops_net

  db:
    image: postgres:15-alpine
    container_name: postgres_chat_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=TuSuperPassword
      - POSTGRES_DB=chat_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - devops_net

networks:
  devops_net:
    driver: bridge

volumes:
  pg_data:
